name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (includes 16KB alignment gate)
        run: ./gradlew :app:assembleDebug

      - name: Host unit tests (all modules)
        # 根任务 `test` 是空操作（无聚合配置）——必须显式枚举模块（2026-11-13 实证）
        run: ./gradlew $(grep -o 'include(":[^"]*")' settings.gradle.kts | sed 's/include("://;s/")//' | sed 's/$/:test/' | tr '\n' ' ')

      - name: Android Lint (NewApi = 0 enforced)
        run: ./gradlew :app:lintDebug

      - name: 16KB alignment gate (explicit)
        run: ./gradlew :app:verify16kAlignment

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
